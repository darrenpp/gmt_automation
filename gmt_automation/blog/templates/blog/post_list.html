{% extends 'main/base.html' %}
{% block title %}Blog - GMT Automation{% endblock %}
{% block content %}
    <h2>Blog Posts</h2>
    {% for post in posts %}
        <h3><a href="{% url 'blog:post_detail' post.pk %}">{{ post.title }}</a></h3>
        <p>{{ post.pub_date }}</p>
        <p>{{ post.content|truncatewords:30 }}</p>
        {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}">
        {% endif %}
    {% endfor %}
{% endblock %}
